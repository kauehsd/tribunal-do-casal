<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tribunal do Casal ⚖️</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=IBM+Plex+Mono:wght@300;400;500&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #08080e;
  --s1: #0f0f18; --s2: #16161f; --s3: #1c1c27;
  --b1: #1e1e2e; --b2: #28283a;
  --gold: #c9953a; --gold2: #e8b45a; --gold3: #f5d080;
  --gold-d: rgba(201,149,58,0.08);
  --red: #c94040; --red2: #e86060; --red-d: rgba(201,64,64,0.08); --red-m: rgba(201,64,64,0.16);
  --blue: #3a6ec9; --blue2: #5a8ee8; --blue-d: rgba(58,110,201,0.08); --blue-m: rgba(58,110,201,0.16);
  --green: #3ab87a; --green2: #5ad49a; --green-d: rgba(58,184,122,0.08);
  --purple: #7a52c9; --purple2: #9a72e8; --purple-d: rgba(122,82,201,0.08);
  --text: #e8e4d8; --text2: #8a8478; --text3: #48443c;
  --mono: 'IBM Plex Mono', monospace;
  --serif: 'Playfair Display', serif;
  --sans: 'Plus Jakarta Sans', sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --bottombar: 64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:
  radial-gradient(ellipse 60% 40% at 20% 0%, rgba(201,149,58,0.04) 0%, transparent 70%),
  radial-gradient(ellipse 50% 50% at 80% 100%, rgba(58,110,201,0.04) 0%, transparent 70%);
  pointer-events:none;z-index:0;}

/* ══ SCREENS ══ */
.screen{display:none;position:relative;z-index:1;}
.screen.active{display:block;}
#s-lobby.active{display:flex;}

/* ══ LOBBY ══ */
#s-lobby{min-height:100vh;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px calc(40px + var(--safe-b));text-align:center;}
.lobby-badge{display:inline-flex;align-items:center;gap:8px;padding:5px 18px;border:1px solid var(--b2);border-radius:100px;font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:.1em;margin-bottom:24px;}
.lobby-title{font-family:var(--serif);font-size:clamp(52px,11vw,96px);font-weight:900;line-height:.95;letter-spacing:-.03em;margin-bottom:8px;}
.lobby-title em{font-style:italic;color:var(--gold2);}
.lobby-sub{color:var(--text2);font-size:14px;font-weight:300;margin-bottom:48px;line-height:1.6;}
.lobby-card{width:100%;max-width:480px;background:var(--s1);border:1px solid var(--b1);border-radius:20px;padding:28px;margin-bottom:20px;}
.lc-title{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:16px;}

/* API key section */
.apikey-row{display:flex;gap:8px;margin-bottom:12px;}
.apikey-inp{flex:1;background:var(--s2);border:1px solid var(--b1);border-radius:10px;padding:12px 14px;color:var(--text);font-family:var(--mono);font-size:12px;letter-spacing:.04em;outline:none;transition:border-color .18s;}
.apikey-inp:focus{border-color:var(--gold);}
.apikey-inp::placeholder{color:var(--text3);font-size:11px;}
.apikey-hint{font-family:var(--mono);font-size:9px;color:var(--text3);line-height:1.5;margin-bottom:16px;text-align:left;padding:10px 12px;background:var(--s2);border-radius:8px;border:1px solid var(--b1);}
.apikey-hint a{color:var(--gold2);text-decoration:none;}
.apikey-status{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9px;padding:6px 10px;border-radius:6px;margin-bottom:12px;}
.apikey-status.ok{background:var(--green-d);color:var(--green2);border:1px solid rgba(58,184,122,.2);}
.apikey-status.no{background:var(--red-d);color:var(--red2);border:1px solid rgba(201,64,64,.2);}

/* Case selector */
.case-scroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:16px;padding-bottom:4px;}
.case-scroll::-webkit-scrollbar{display:none;}
.case-chip{flex-shrink:0;padding:8px 14px;border-radius:8px;border:1px solid var(--b1);background:var(--s2);color:var(--text2);font-family:var(--mono);font-size:10px;cursor:pointer;transition:all .18s;white-space:nowrap;}
.case-chip:hover{border-color:var(--b2);color:var(--text);}
.case-chip.active{border-color:var(--gold);color:var(--gold2);background:var(--gold-d);}

/* Role cards */
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.role-chip{padding:16px 12px;border-radius:12px;border:1px solid var(--b1);background:var(--s2);cursor:pointer;transition:all .2s;text-align:center;position:relative;overflow:hidden;}
.role-chip::before{content:'';position:absolute;inset:0;opacity:0;transition:opacity .2s;}
.role-chip.r-acu::before{background:radial-gradient(circle at 50% 100%,rgba(201,64,64,.12),transparent 70%);}
.role-chip.r-def::before{background:radial-gradient(circle at 50% 100%,rgba(58,110,201,.12),transparent 70%);}
.role-chip:hover::before{opacity:1;}
.role-chip.r-acu:hover,.role-chip.r-acu.sel{border-color:var(--red);box-shadow:0 0 20px rgba(201,64,64,.1);}
.role-chip.r-def:hover,.role-chip.r-def.sel{border-color:var(--blue);box-shadow:0 0 20px rgba(58,110,201,.1);}
.role-chip .rc-icon{font-size:22px;margin-bottom:6px;display:block;}
.role-chip .rc-name{font-family:var(--serif);font-size:16px;font-weight:700;}
.role-chip.r-acu .rc-name{color:var(--red2);}
.role-chip.r-def .rc-name{color:var(--blue2);}
.role-chip .rc-desc{font-size:11px;color:var(--text3);line-height:1.4;margin-top:4px;}

/* Inputs */
.name-inp{width:100%;background:var(--s2);border:1px solid var(--b1);border-radius:10px;padding:13px 16px;color:var(--text);font-family:var(--sans);font-size:15px;outline:none;transition:border-color .18s;margin-bottom:12px;}
.name-inp:focus{border-color:var(--gold);}
.name-inp::placeholder{color:var(--text3);}
.room-row{display:flex;gap:8px;margin-bottom:12px;}
.room-inp{flex:1;background:var(--s2);border:1px solid var(--b1);border-radius:10px;padding:13px 16px;color:var(--text);font-family:var(--mono);font-size:18px;letter-spacing:.15em;text-transform:uppercase;outline:none;transition:border-color .18s;text-align:center;}
.room-inp:focus{border-color:var(--gold);}
.room-inp::placeholder{color:var(--text3);font-size:12px;letter-spacing:.08em;}

.btn-primary{width:100%;padding:15px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1000;font-family:var(--mono);font-size:12px;letter-spacing:.1em;font-weight:500;cursor:pointer;transition:all .2s;min-height:50px;}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(201,149,58,.25);}
.btn-primary:disabled{opacity:.4;transform:none;cursor:not-allowed;}
.btn-secondary{width:100%;padding:12px;border-radius:10px;border:1px solid var(--b2);background:none;color:var(--text2);font-family:var(--mono);font-size:11px;letter-spacing:.08em;cursor:pointer;transition:all .18s;margin-top:8px;}
.btn-secondary:hover{border-color:var(--gold);color:var(--gold);}
.divider{display:flex;align-items:center;gap:12px;margin:16px 0;}
.divider span{font-family:var(--mono);font-size:10px;color:var(--text3);}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--b1);}
.generated-code{background:var(--s2);border:1px solid var(--gold);border-radius:10px;padding:14px;text-align:center;margin-bottom:12px;}
.gc-label{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:.1em;margin-bottom:4px;}
.gc-code{font-family:var(--mono);font-size:32px;color:var(--gold2);letter-spacing:.2em;font-weight:500;}

/* Waiting */
.waiting-card{background:var(--s1);border:1px solid var(--b1);border-radius:16px;padding:24px;text-align:center;max-width:400px;width:100%;}
.wc-spinner{width:40px;height:40px;border:3px solid var(--b2);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg);}}
.wc-title{font-family:var(--serif);font-size:20px;color:var(--gold2);margin-bottom:8px;}
.wc-sub{font-size:13px;color:var(--text2);font-weight:300;line-height:1.6;margin-bottom:16px;}
.players-list{display:flex;flex-direction:column;gap:6px;}
.player-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:var(--s2);border:1px solid var(--b1);}
.pi-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.pi-dot.acusacao{background:var(--red2);}
.pi-dot.defesa{background:var(--blue2);}
.pi-dot.empty{background:var(--b2);}
.pi-name{font-size:13px;flex:1;}
.pi-role{font-family:var(--mono);font-size:9px;color:var(--text3);}

/* ══ GAME SCREEN ══ */
#s-game{height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* Top bar */
.game-topbar{
  display:flex;align-items:center;gap:8px;
  padding:10px 14px;
  padding-top:calc(10px + var(--safe-t));
  border-bottom:1px solid var(--b1);
  background:rgba(8,8,14,.97);
  backdrop-filter:blur(16px);
  flex-shrink:0;
  z-index:100;
}
.gtb-back{background:none;border:1px solid var(--b1);border-radius:8px;padding:7px 12px;color:var(--text3);font-family:var(--mono);font-size:10px;cursor:pointer;transition:all .15s;flex-shrink:0;}
.gtb-back:hover{border-color:var(--b2);color:var(--text2);}
.gtb-title{font-family:var(--serif);font-size:15px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.gtb-badge{display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:100px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;flex-shrink:0;}
.gtb-badge.acusacao{background:var(--red-d);color:var(--red2);border:1px solid rgba(201,64,64,.25);}
.gtb-badge.defesa{background:var(--blue-d);color:var(--blue2);border:1px solid rgba(58,110,201,.25);}
.online-dot{width:6px;height:6px;border-radius:50%;background:var(--green2);animation:pulse 2s infinite;flex-shrink:0;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

/* Content area */
.game-content{flex:1;overflow:hidden;position:relative;}
.tab-panel{display:none;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.tab-panel.active{display:flex;flex-direction:column;animation:fadeUp .22s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* Bottom Tab Bar — app style */
.bottom-bar{
  display:flex;
  background:rgba(8,8,14,.97);
  backdrop-filter:blur(20px);
  border-top:1px solid var(--b1);
  padding-bottom:var(--safe-b);
  flex-shrink:0;
  z-index:100;
}
.btab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:10px 4px;min-height:56px;
  background:none;border:none;
  color:var(--text3);font-family:var(--mono);font-size:9px;letter-spacing:.04em;
  cursor:pointer;transition:all .18s;position:relative;gap:4px;
}
.btab:hover{color:var(--text2);}
.btab.active{color:var(--gold2);}
.btab-icon{font-size:18px;line-height:1;position:relative;}
.btab-notif{
  position:absolute;top:-3px;right:-6px;
  width:8px;height:8px;border-radius:50%;
  background:var(--red2);display:none;
  border:1.5px solid var(--bg);
}
.btab-notif.show{display:block;}
.btab-label{font-size:9px;letter-spacing:.04em;}
.btab-indicator{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:0;height:2px;background:var(--gold);border-radius:0 0 2px 2px;
  transition:width .2s;
}
.btab.active .btab-indicator{width:28px;}

/* Game body scroll area */
.game-body{padding:16px 14px 24px;max-width:900px;width:100%;margin:0 auto;}

/* Cards */
.card{background:var(--s1);border:1px solid var(--b1);border-radius:14px;padding:20px;margin-bottom:12px;}
.card-sm{background:var(--s2);border:1px solid var(--b1);border-radius:10px;padding:14px;margin-bottom:8px;}
.section-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.section-lbl::after{content:'';flex:1;height:1px;background:var(--b1);}
.brief-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.tag{padding:3px 10px;border-radius:4px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;border:1px solid;}
.tg{border-color:var(--gold);color:var(--gold2);background:var(--gold-d);}
.tr{border-color:var(--red);color:var(--red2);background:var(--red-d);}
.tb{border-color:var(--blue);color:var(--blue2);background:var(--blue-d);}
.tp{border-color:var(--purple);color:var(--purple2);background:var(--purple-d);}
.brief-title{font-family:var(--serif);font-size:clamp(18px,3.5vw,26px);font-weight:700;margin-bottom:10px;}
.brief-body{font-size:13.5px;line-height:1.78;color:var(--text2);font-weight:300;}
.brief-body strong{color:var(--text);font-weight:500;}

/* Art cards */
.art-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
@media(max-width:400px){.art-grid{grid-template-columns:1fr;}}
.art-card{background:var(--s2);border:1px solid var(--b1);border-radius:10px;padding:13px;cursor:pointer;transition:all .18s;}
.art-card:hover{border-color:var(--b2);background:var(--s3);}
.art-card.expanded{border-color:var(--gold);background:var(--gold-d);}
.art-num{font-family:var(--mono);font-size:10px;color:var(--gold2);margin-bottom:3px;}
.art-name{font-family:var(--serif);font-size:15px;font-weight:700;margin-bottom:3px;}
.art-pena{font-family:var(--mono);font-size:10px;color:var(--text3);}
.art-body{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--b1);}
.art-card.expanded .art-body{display:block;}
.art-texto{font-family:var(--serif);font-size:13px;color:var(--text2);font-style:italic;line-height:1.7;margin-bottom:8px;padding-left:10px;border-left:2px solid var(--gold);}
.art-exp{font-size:12px;color:var(--text2);line-height:1.6;font-weight:300;}
.art-juris{margin-top:8px;padding:8px 10px;background:var(--purple-d);border:1px solid rgba(122,82,201,.15);border-radius:6px;font-size:11px;color:var(--text2);font-style:italic;}
.art-juris-ref{font-family:var(--mono);font-size:9px;color:var(--purple2);display:block;margin-top:2px;}
.art-use-btn{margin-top:10px;width:100%;padding:9px;border-radius:8px;border:1px solid var(--gold);background:var(--gold-d);color:var(--gold2);font-family:var(--mono);font-size:10px;letter-spacing:.08em;cursor:pointer;transition:all .15s;}
.art-use-btn:hover{background:rgba(201,149,58,.16);}

/* ══ CHAT ══ */
#tab-chat{display:none;flex-direction:column;}
#tab-chat.active{display:flex;}
.chat-messages{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin;scrollbar-color:var(--b2) transparent;}
.chat-messages::-webkit-scrollbar{width:4px;}
.chat-messages::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px;}
.msg{display:flex;flex-direction:column;max-width:85%;animation:fadeUp .2s ease;}
.msg.mine{align-self:flex-end;align-items:flex-end;}
.msg.theirs{align-self:flex-start;align-items:flex-start;}
.msg.judge{align-self:center;align-items:center;max-width:95%;}
.msg-header{display:flex;align-items:center;gap:6px;margin-bottom:3px;}
.msg-role{font-family:var(--mono);font-size:9px;letter-spacing:.08em;}
.msg-role.acusacao{color:var(--red2);}
.msg-role.defesa{color:var(--blue2);}
.msg-role.juiz{color:var(--gold2);}
.msg-time{font-family:var(--mono);font-size:9px;color:var(--text3);}
.msg-bubble{padding:11px 14px;border-radius:12px;font-size:13.5px;line-height:1.6;font-weight:300;word-break:break-word;}
.msg.mine .msg-bubble{background:var(--s3);border:1px solid var(--b2);border-bottom-right-radius:4px;}
.msg.theirs .msg-bubble{background:var(--s2);border:1px solid var(--b1);border-bottom-left-radius:4px;}
.msg.mine.acusacao .msg-bubble{background:var(--red-d);border-color:rgba(201,64,64,.2);}
.msg.mine.defesa .msg-bubble{background:var(--blue-d);border-color:rgba(58,110,201,.2);}
.msg.judge .msg-bubble{background:linear-gradient(135deg,rgba(201,149,58,.08),rgba(201,149,58,.04));border:1px solid rgba(201,149,58,.25);border-radius:12px;width:100%;text-align:center;}
.msg-art-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-family:var(--mono);font-size:9px;background:rgba(201,149,58,.1);border:1px solid rgba(201,149,58,.2);color:var(--gold2);margin-top:6px;}
.sys-msg{text-align:center;font-family:var(--mono);font-size:10px;color:var(--text3);padding:6px 0;letter-spacing:.06em;}
.chat-input-wrap{padding:10px 12px;border-top:1px solid var(--b1);background:rgba(8,8,14,.95);backdrop-filter:blur(12px);flex-shrink:0;}
.art-quick-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:8px;padding-bottom:2px;}
.art-quick-row::-webkit-scrollbar{display:none;}
.art-quick-pill{flex-shrink:0;padding:5px 10px;border-radius:6px;border:1px solid var(--b2);background:none;color:var(--text3);font-family:var(--mono);font-size:9px;cursor:pointer;transition:all .15s;white-space:nowrap;}
.art-quick-pill:hover{border-color:var(--gold);color:var(--gold2);background:var(--gold-d);}
.chat-row{display:flex;gap:8px;}
.chat-inp{flex:1;background:var(--s2);border:1px solid var(--b1);border-radius:10px;padding:12px 14px;color:var(--text);font-family:var(--sans);font-size:14px;outline:none;resize:none;min-height:48px;max-height:100px;transition:border-color .18s;}
.chat-inp:focus{border-color:var(--gold);}
.chat-inp::placeholder{color:var(--text3);}
.chat-send{padding:0 16px;border-radius:10px;border:none;background:var(--gold);color:#1a1000;font-family:var(--mono);font-size:11px;letter-spacing:.08em;cursor:pointer;transition:all .18s;min-height:48px;flex-shrink:0;font-weight:500;}
.chat-send:hover{background:var(--gold2);}
.chat-send:disabled{opacity:.4;cursor:not-allowed;}
.typing-ind{font-family:var(--mono);font-size:10px;color:var(--gold2);padding:4px 14px;display:none;flex-shrink:0;}
.typing-ind.show{display:block;}
.typing-dots{display:inline-flex;gap:3px;}
.typing-dots span{width:4px;height:4px;border-radius:50%;background:var(--gold2);animation:dot-blink 1.2s infinite;}
.typing-dots span:nth-child(2){animation-delay:.2s;}
.typing-dots span:nth-child(3){animation-delay:.4s;}
@keyframes dot-blink{0%,80%,100%{opacity:.2;}40%{opacity:1;}}

/* ══ CALC ══ */
.calc-display{background:linear-gradient(135deg,var(--s2),var(--s3));border:1px solid var(--b2);border-radius:14px;padding:20px;margin-bottom:14px;text-align:center;}
.calc-big{font-family:var(--serif);font-size:64px;font-weight:900;color:var(--gold2);line-height:1;}
.calc-big span{font-size:20px;color:var(--text3);font-family:var(--mono);font-weight:300;}
.calc-regime{font-family:var(--mono);font-size:11px;color:var(--green2);letter-spacing:.06em;margin-top:6px;}
.calc-phases{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:12px;}
.calc-phase{background:var(--s1);border:1px solid var(--b1);border-radius:8px;padding:10px;text-align:center;}
.cp-lbl{font-family:var(--mono);font-size:8px;color:var(--text3);letter-spacing:.06em;margin-bottom:3px;}
.cp-val{font-family:var(--serif);font-size:16px;font-weight:700;}
.cp-val.v1{color:var(--gold2);}
.cp-val.v2{color:var(--gold);}
.cp-val.v3{color:var(--green2);}
.slider-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.slider-lbl{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);}
.slider-val{font-family:var(--mono);font-size:11px;color:var(--gold2);}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:2px;background:var(--b2);outline:none;cursor:pointer;margin-bottom:16px;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--gold);cursor:pointer;transition:transform .15s;}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15);}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--gold);cursor:pointer;border:none;}
.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px;}
@media(max-width:400px){.check-grid{grid-template-columns:1fr;}}
.chk-item{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:8px;border:1px solid var(--b1);background:var(--s2);cursor:pointer;transition:all .18s;}
.chk-item:hover{border-color:var(--b2);}
.chk-item.on-agg{border-color:rgba(201,64,64,.4);background:var(--red-d);}
.chk-item.on-ate{border-color:rgba(58,184,122,.4);background:var(--green-d);}
.chk-box{width:18px;height:18px;border-radius:4px;border:1px solid var(--b2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .15s;}
.chk-item.on-agg .chk-box{background:var(--red);border-color:var(--red);color:#fff;}
.chk-item.on-ate .chk-box{background:var(--green);border-color:var(--green);color:#fff;}
.chk-lbl{font-size:12px;color:var(--text2);line-height:1.4;font-weight:300;}
.chk-ef{font-family:var(--mono);font-size:9px;color:var(--text3);margin-top:2px;}
.chk-item.on-agg .chk-ef{color:var(--red2);}
.chk-item.on-ate .chk-ef{color:var(--green2);}

/* Score */
.score-row{display:flex;gap:8px;margin-bottom:10px;}
.score-side{flex:1;background:var(--s2);border:1px solid var(--b1);border-radius:10px;padding:12px;text-align:center;}
.ss-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;}
.ss-lbl.acu{color:var(--red2);}
.ss-lbl.def{color:var(--blue2);}
.ss-num{font-family:var(--serif);font-size:40px;font-weight:900;line-height:1;}
.score-side.acu .ss-num{color:var(--red2);}
.score-side.def .ss-num{color:var(--blue2);}
.score-vs{display:flex;align-items:center;font-family:var(--serif);font-size:20px;color:var(--text3);font-style:italic;padding:0 4px;flex-shrink:0;}
.score-btns{display:flex;gap:6px;}
.score-btn{flex:1;padding:10px;border-radius:8px;border:1px solid var(--b1);background:none;font-family:var(--mono);font-size:10px;letter-spacing:.06em;cursor:pointer;transition:all .15s;min-height:44px;}
.score-btn.acu{color:var(--red2);border-color:rgba(201,64,64,.3);}
.score-btn.def{color:var(--blue2);border-color:rgba(58,110,201,.3);}
.score-btn.acu:hover{background:var(--red-d);}
.score-btn.def:hover{background:var(--blue-d);}
.score-btn.rst{color:var(--text3);max-width:52px;flex:0 0 52px;}

/* ══ VEREDITO ══ */
.verdict-locked{background:var(--s1);border:1px solid var(--b1);border-radius:16px;padding:32px 24px;text-align:center;margin-bottom:12px;}
.vl-icon{font-size:48px;margin-bottom:12px;display:block;}
.vl-title{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--gold2);margin-bottom:8px;}
.vl-sub{font-size:13px;color:var(--text3);font-weight:300;line-height:1.6;margin-bottom:20px;max-width:340px;margin-left:auto;margin-right:auto;}

/* Pena dos jogadores */
.player-pena-section{margin-bottom:20px;text-align:left;}
.pp-title{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--text3);margin-bottom:10px;}
.pp-row{display:flex;gap:8px;margin-bottom:8px;}
.pp-side{flex:1;background:var(--s2);border:1px solid var(--b1);border-radius:10px;padding:12px;}
.pp-side.acu{border-color:rgba(201,64,64,.2);}
.pp-side.def{border-color:rgba(58,110,201,.2);}
.pp-label{font-family:var(--mono);font-size:9px;margin-bottom:6px;}
.pp-label.acu{color:var(--red2);}
.pp-label.def{color:var(--blue2);}
.pp-inp{width:100%;background:var(--s3);border:1px solid var(--b2);border-radius:7px;padding:8px 10px;color:var(--text);font-family:var(--mono);font-size:13px;outline:none;transition:border-color .15s;}
.pp-inp.acu:focus{border-color:var(--red);}
.pp-inp.def:focus{border-color:var(--blue);}
.pp-inp::placeholder{color:var(--text3);font-size:11px;}

.btn-reveal{display:inline-flex;align-items:center;gap:9px;padding:14px 28px;border-radius:12px;border:1px solid var(--gold);background:var(--gold-d);color:var(--gold2);font-family:var(--mono);font-size:11px;letter-spacing:.08em;cursor:pointer;transition:all .2s;min-height:48px;}
.btn-reveal:hover{background:rgba(201,149,58,.16);transform:translateY(-2px);box-shadow:0 0 32px rgba(201,149,58,.15);}
.btn-reveal:disabled{opacity:.4;transform:none;cursor:not-allowed;}
.ai-loading{display:none;margin-top:16px;}
.ai-loading.show{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--mono);font-size:11px;color:var(--gold2);}

/* Instâncias nav */
.inst-nav{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none;}
.inst-nav::-webkit-scrollbar{display:none;}
.inst-btn{flex-shrink:0;padding:8px 14px;border-radius:8px;border:1px solid var(--b1);background:var(--s2);color:var(--text3);font-family:var(--mono);font-size:9px;letter-spacing:.06em;cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:6px;white-space:nowrap;}
.inst-btn:hover{border-color:var(--b2);color:var(--text2);}
.inst-btn.active{border-color:var(--gold);color:var(--gold2);background:var(--gold-d);}
.inst-btn.locked{opacity:.35;cursor:not-allowed;}
.inst-btn .inst-dot{width:6px;height:6px;border-radius:50%;background:var(--text3);}
.inst-btn.active .inst-dot{background:var(--gold2);}
.inst-btn.done-cond .inst-dot{background:var(--red2);}
.inst-btn.done-absol .inst-dot{background:var(--green2);}
.inst-btn.done-parc .inst-dot{background:var(--gold2);}

/* Recurso */
.recurso-section{margin-top:16px;padding-top:16px;border-top:1px solid var(--b1);}
.recurso-title{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:.08em;margin-bottom:10px;}
.recurso-btns{display:flex;gap:8px;}
.btn-recurso{flex:1;padding:11px;border-radius:10px;border:1px solid;font-family:var(--mono);font-size:10px;letter-spacing:.06em;cursor:pointer;transition:all .18s;min-height:44px;}
.btn-recurso.acu{border-color:rgba(201,64,64,.3);color:var(--red2);background:none;}
.btn-recurso.acu:hover{background:var(--red-d);}
.btn-recurso.def{border-color:rgba(58,110,201,.3);color:var(--blue2);background:none;}
.btn-recurso.def:hover{background:var(--blue-d);}
.btn-recurso:disabled{opacity:.35;cursor:not-allowed;}

/* Recurso input */
.recurso-input-wrap{background:var(--s2);border:1px solid var(--b1);border-radius:12px;padding:16px;margin-top:12px;animation:fadeUp .2s ease;}
.ri-label{font-family:var(--mono);font-size:9px;letter-spacing:.08em;margin-bottom:8px;}
.ri-label.acu{color:var(--red2);}
.ri-label.def{color:var(--blue2);}
.ri-ta{width:100%;background:var(--s3);border:1px solid var(--b2);border-radius:8px;padding:11px 13px;color:var(--text);font-family:var(--sans);font-size:13px;resize:none;outline:none;min-height:80px;transition:border-color .15s;margin-bottom:10px;}
.ri-ta:focus{border-color:var(--gold);}
.ri-ta::placeholder{color:var(--text3);}
.btn-enviar-recurso{width:100%;padding:12px;border-radius:9px;border:none;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1000;font-family:var(--mono);font-size:11px;letter-spacing:.08em;cursor:pointer;transition:all .18s;font-weight:500;}
.btn-enviar-recurso:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(201,149,58,.2);}
.btn-enviar-recurso:disabled{opacity:.4;transform:none;cursor:not-allowed;}

/* Verdict card */
@keyframes unveil{from{opacity:0;transform:scale(.97);}to{opacity:1;transform:scale(1);}}
.verdict-card{background:var(--s1);border-radius:16px;padding:24px;margin-bottom:12px;animation:unveil .5s ease;}
.verdict-card.inst-1a{border:1px solid rgba(201,149,58,.3);}
.verdict-card.inst-tj{border:1px solid rgba(58,110,201,.3);}
.verdict-card.inst-stj{border:1px solid rgba(122,82,201,.3);}
.verdict-stamp{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--b1);}
.vs-icon{font-size:30px;}
.vs-label{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:.1em;margin-bottom:3px;}
.vs-name{font-family:var(--serif);font-size:22px;font-weight:700;}
.vs-name.cond{color:var(--red2);}
.vs-name.absol{color:var(--green2);}
.vs-name.parc{color:var(--gold2);}
.verdict-pena{background:var(--s2);border:1px solid var(--b1);border-radius:10px;padding:12px 16px;margin-bottom:14px;}
.vp-num{font-family:var(--serif);font-size:30px;font-weight:900;color:var(--gold2);margin-bottom:2px;line-height:1.1;}
.vp-lbl{font-family:var(--mono);font-size:10px;color:var(--text3);}
.verdict-ratio{font-family:var(--serif);font-size:13.5px;color:var(--text2);font-style:italic;line-height:1.75;margin-bottom:14px;border-left:2px solid rgba(201,149,58,.3);padding-left:14px;}
.verdict-fund{font-size:13px;color:var(--text2);font-weight:300;line-height:1.7;margin-bottom:12px;}
.verdict-fund strong{color:var(--text);font-weight:500;}
.verdict-arts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.vart{padding:3px 10px;border-radius:4px;font-family:var(--mono);font-size:10px;border:1px solid rgba(201,149,58,.25);color:var(--gold2);background:rgba(201,149,58,.06);}

/* Argumento do recurso exibido */
.recurso-arg{background:var(--s2);border-radius:10px;padding:12px 14px;margin-bottom:12px;border-left:3px solid;}
.recurso-arg.acu{border-color:var(--red);}
.recurso-arg.def{border-color:var(--blue);}
.recurso-arg-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.07em;margin-bottom:6px;}
.recurso-arg-lbl.acu{color:var(--red2);}
.recurso-arg-lbl.def{color:var(--blue2);}
.recurso-arg-txt{font-size:12.5px;color:var(--text2);line-height:1.6;font-weight:300;}

/* Nokey warning */
.nokey-warn{background:rgba(201,64,64,.06);border:1px solid rgba(201,64,64,.2);border-radius:10px;padding:14px;margin-bottom:14px;font-family:var(--mono);font-size:10px;color:var(--red2);line-height:1.6;text-align:left;}
.nokey-warn a{color:var(--gold2);text-decoration:none;}

/* ══ NOTAS ══ */
.notas-ta{width:100%;min-height:calc(100vh - 280px);background:var(--s2);border:1px solid var(--b1);border-radius:12px;padding:16px;color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.7;resize:none;outline:none;transition:border-color .18s;}
.notas-ta:focus{border-color:var(--gold);}
.notas-ta::placeholder{color:var(--text3);}

/* Juiz interativo — destaque especial */
.msg.judge-active .msg-bubble{background:linear-gradient(135deg,rgba(201,149,58,.12),rgba(201,149,58,.06));border:1px solid rgba(201,149,58,.4);border-left:3px solid var(--gold2);}

.divhr{height:1px;background:var(--b1);margin:14px 0;}

/* Chat de recurso (instâncias superiores) */
.recurso-chat-wrap{margin-top:16px;border-top:1px solid var(--b1);padding-top:14px;}
.recurso-chat-title{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:.08em;margin-bottom:10px;}
.recurso-chat-msgs{background:var(--s2);border:1px solid var(--b1);border-radius:12px;padding:12px;min-height:80px;max-height:260px;overflow-y:auto;margin-bottom:10px;display:flex;flex-direction:column;gap:8px;}
.rc-msg{padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.6;font-weight:300;}
.rc-msg.acu{background:var(--red-d);border:1px solid rgba(201,64,64,.15);border-bottom-left-radius:4px;}
.rc-msg.def{background:var(--blue-d);border:1px solid rgba(58,110,201,.15);border-bottom-right-radius:4px;align-self:flex-end;}
.rc-msg.judge{background:var(--gold-d);border:1px solid rgba(201,149,58,.2);text-align:center;}
.rc-msg-hdr{font-family:var(--mono);font-size:9px;margin-bottom:4px;}
.rc-msg-hdr.acu{color:var(--red2);}
.rc-msg-hdr.def{color:var(--blue2);}
.rc-msg-hdr.judge{color:var(--gold2);}
.recurso-chat-input{display:flex;gap:8px;}
.recurso-chat-inp{flex:1;background:var(--s3);border:1px solid var(--b2);border-radius:9px;padding:11px 13px;color:var(--text);font-family:var(--sans);font-size:13px;outline:none;min-height:44px;transition:border-color .15s;}
.recurso-chat-inp:focus{border-color:var(--gold);}
.recurso-chat-inp::placeholder{color:var(--text3);}
.recurso-chat-send{padding:0 14px;border-radius:9px;border:none;background:var(--gold);color:#1a1000;font-family:var(--mono);font-size:10px;letter-spacing:.07em;cursor:pointer;min-height:44px;flex-shrink:0;font-weight:500;}
.recurso-chat-send:hover{background:var(--gold2);}
</head>
<body>

<!-- ══ LOBBY ══ -->
<div id="s-lobby" class="screen active">
  <div class="lobby-badge">⚖️ &nbsp; SIMULADOR JURÍDICO MULTIJOGADOR</div>
  <h1 class="lobby-title">Tribunal<br><em>do Casal</em></h1>
  <p class="lobby-sub">Debata casos reais com seu parceiro.<br>O Juiz IA lê tudo e dá o veredito.</p>

  <!-- API KEY -->
  <div class="lobby-card" style="max-width:480px;">
    <div class="lc-title">// juiz ia — chave gemini (grátis)</div>
    <div id="apikey-status-box" style="display:none;"></div>
    <div class="apikey-row">
      <input class="apikey-inp" id="inp-apikey" type="password" placeholder="AIza..." autocomplete="off" oninput="onApiKeyInput()">
    </div>
    <div class="apikey-hint">
      🆓 Use o <strong style="color:var(--gold2)">Google Gemini — é grátis!</strong><br>
      1. Acesse <a href="https://aistudio.google.com/app/apikey" target="_blank">aistudio.google.com →</a><br>
      2. Clique em <strong>Get API Key → Create API Key</strong><br>
      3. Cole aqui a chave (começa com <strong>AIza</strong>)<br><br>
      🔒 A chave fica só na memória desta sessão, nunca sai do dispositivo.<br>
      Sem chave o Juiz usa respostas fixas de fallback.
    </div>
  </div>

  <!-- CRIAR SALA -->
  <div class="lobby-card" id="card-create">
    <div class="lc-title">// criar sala</div>
    <div class="lc-title" style="margin-bottom:8px;">caso</div>
    <div class="case-scroll" id="case-scroll"></div>
    <div class="lc-title" style="margin-bottom:8px;">seu papel</div>
    <div class="role-grid">
      <div class="role-chip r-acu" id="rc-acu" onclick="selectRole('acusacao')">
        <span class="rc-icon">⚔️</span>
        <div class="rc-name">Acusação</div>
        <div class="rc-desc">Prove a culpa e peça condenação</div>
      </div>
      <div class="role-chip r-def" id="rc-def" onclick="selectRole('defesa')">
        <span class="rc-icon">🛡️</span>
        <div class="rc-name">Defesa</div>
        <div class="rc-desc">Construa teses e proteja o réu</div>
      </div>
    </div>
    <input class="name-inp" id="inp-name-create" type="text" placeholder="Seu nome" maxlength="20">
    <div id="code-display" style="display:none;">
      <div class="generated-code">
        <div class="gc-label">CÓDIGO DA SALA — manda pro seu parceiro</div>
        <div class="gc-code" id="room-code-display">----</div>
      </div>
    </div>
    <button class="btn-primary" id="btn-create" onclick="createRoom()">CRIAR SALA</button>
  </div>

  <div class="divider"><span>ou</span></div>

  <!-- ENTRAR EM SALA -->
  <div class="lobby-card" id="card-join">
    <div class="lc-title">// entrar em sala existente</div>
    <div class="lc-title" style="margin-bottom:8px;">seu papel</div>
    <div class="role-grid">
      <div class="role-chip r-acu" id="rj-acu" onclick="selectJoinRole('acusacao')">
        <span class="rc-icon">⚔️</span>
        <div class="rc-name">Acusação</div>
        <div class="rc-desc">Prove a culpa e peça condenação</div>
      </div>
      <div class="role-chip r-def" id="rj-def" onclick="selectJoinRole('defesa')">
        <span class="rc-icon">🛡️</span>
        <div class="rc-name">Defesa</div>
        <div class="rc-desc">Construa teses e proteja o réu</div>
      </div>
    </div>
    <input class="name-inp" id="inp-name-join" type="text" placeholder="Seu nome" maxlength="20">
    <div class="room-row">
      <input class="room-inp" id="inp-room-code" type="text" placeholder="CÓDIGO DA SALA" maxlength="4">
    </div>
    <button class="btn-primary" id="btn-join" onclick="joinRoom()">ENTRAR NA SALA</button>
  </div>

  <!-- WAITING -->
  <div id="card-waiting" style="display:none;">
    <div class="waiting-card">
      <div class="wc-spinner"></div>
      <div class="wc-title">Aguardando parceiro...</div>
      <div class="wc-sub">Compartilhe o código abaixo para seu parceiro entrar</div>
      <div class="generated-code" style="margin-bottom:16px;">
        <div class="gc-label">CÓDIGO DA SALA</div>
        <div class="gc-code" id="waiting-code">----</div>
      </div>
      <div class="players-list" id="players-list"></div>
      <button class="btn-secondary" onclick="startAnySolo()" style="margin-top:12px;">Jogar solo (sem parceiro)</button>
    </div>
  </div>
</div>

<!-- ══ GAME ══ -->
<div id="s-game" class="screen">

  <!-- Top bar -->
  <div class="game-topbar">
    <button class="gtb-back" onclick="backToLobby()">← SAIR</button>
    <span class="gtb-title" id="gtb-title"></span>
    <span class="gtb-badge" id="gtb-badge"><span class="online-dot"></span><span id="gtb-role-txt"></span></span>
  </div>

  <!-- Content panels -->
  <div class="game-content">

    <!-- TAB CASO -->
    <div class="tab-panel active" id="tab-caso">
      <div class="game-body">
        <div class="card">
          <div class="brief-tags" id="g-tags"></div>
          <div class="brief-title" id="g-title"></div>
          <div class="brief-body" id="g-body"></div>
        </div>
        <div class="section-lbl" id="g-guide-lbl">// pontos para pensar</div>
        <div id="g-guide"></div>
        <div class="card" style="margin-top:12px;">
          <div class="section-lbl">// pontos polêmicos do debate</div>
          <div id="g-hot"></div>
        </div>
      </div>
    </div>

    <!-- TAB CHAT -->
    <div class="tab-panel" id="tab-chat">
      <div class="chat-messages" id="chat-messages">
        <div class="sys-msg">⚖️ Debate iniciado — que comecem os argumentos</div>
      </div>
      <div class="typing-ind" id="typing-ind">
        <span id="typing-who"></span> está digitando <span class="typing-dots"><span></span><span></span><span></span></span>
      </div>
      <div class="chat-input-wrap">
        <div class="art-quick-row" id="art-quick-row"></div>
        <div class="chat-row">
          <textarea class="chat-inp" id="chat-inp" placeholder="Seu argumento..." rows="1" oninput="onChatInput()" onkeydown="onChatKey(event)"></textarea>
          <button class="chat-send" id="btn-send" onclick="sendMessage()">ENVIAR</button>
        </div>
      </div>
    </div>

    <!-- TAB VADE -->
    <div class="tab-panel" id="tab-vade">
      <div class="game-body">
        <div class="section-lbl">// artigos relevantes — toque para expandir</div>
        <div class="art-grid" id="vade-grid"></div>
      </div>
    </div>

    <!-- TAB CALC -->
    <div class="tab-panel" id="tab-calc">
      <div class="game-body">
        <div class="calc-display">
          <div class="calc-big" id="calc-big">—<span> anos</span></div>
          <div class="calc-regime" id="calc-regime">Ajuste as fases</div>

function clearApiKey() {

}

// Função central de chamada ao Gemini
async function callGemini(systemPrompt, userPrompt, maxTokens) {
  const model = 'gemini-2.0-flash';
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${geminiKey}`;
  const body = {
    system_instruction: { parts: [{ text: systemPrompt }] },
    contents: [{ role: 'user', parts: [{ text: userPrompt }] }],
    generationConfig: { maxOutputTokens: maxTokens || 1200, temperature: 0.7 }
  };
  const resp = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  const data = await resp.json();
  if (data.error) throw new Error(data.error.message);
  return data.candidates?.[0]?.content?.parts?.[0]?.text || '';
}

// ═══════════════════════════════════════════════════════
// CRIAR SALA
// ═══════════════════════════════════════════════════════
async function createRoom() {
  const name = document.getElementById('inp-name-create').value.trim();
  if (!name) { alert('Digite seu nome!'); return; }
  if (!state.createRole) { alert('Escolha seu papel!'); return; }
  const btn = document.getElementById('btn-create');
  btn.disabled = true; btn.textContent = 'CRIANDO...';
  state.myName = name; state.myRole = state.createRole;
  state.roomCode = Math.random().toString(36).substr(2,4).toUpperCase();
  roomRef = db.ref(`rooms/${state.roomCode}`);
  messagesRef = db.ref(`rooms/${state.roomCode}/messages`);
  try {
    const snap = await roomRef.once('value');
    if (snap.exists()) {
      state.roomCode = Math.random().toString(36).substr(2,4).toUpperCase();
      roomRef = db.ref(`rooms/${state.roomCode}`);
      messagesRef = db.ref(`rooms/${state.roomCode}/messages`);
    }
    await roomRef.set({
      creator:name, creatorRole:state.myRole, caseIdx:state.caseIdx,
      scoreAcu:0, scoreDef:0, ready:false,
      createdAt:firebase.database.ServerValue.TIMESTAMP,
    });
    setTimeout(()=>{ if(roomRef) roomRef.remove(); }, 3*60*60*1000);
    btn.disabled = false; btn.textContent = 'CRIAR SALA';
    document.getElementById('room-code-display').textContent = state.roomCode;
    document.getElementById('code-display').style.display = 'block';
    showWaiting();
  } catch(e) {
    btn.disabled = false; btn.textContent = 'CRIAR SALA';
    alert('Erro ao criar sala: ' + e.message);
  }
}

// ═══════════════════════════════════════════════════════
// ENTRAR EM SALA
// ═══════════════════════════════════════════════════════
async function joinRoom() {
  const name = document.getElementById('inp-name-join').value.trim();
  const code = document.getElementById('inp-room-code').value.trim().toUpperCase();
  if (!name) { alert('Digite seu nome!'); return; }
  if (!state.joinRole) { alert('Escolha seu papel!'); return; }
  if (code.length !== 4) { alert('Código inválido! Deve ter 4 letras.'); return; }
  const btn = document.getElementById('btn-join');
  btn.disabled = true; btn.textContent = 'ENTRANDO...';
  state.myName = name; state.myRole = state.joinRole; state.roomCode = code;
  roomRef = db.ref(`rooms/${code}`);
  messagesRef = db.ref(`rooms/${code}/messages`);
  try {
    const snap = await roomRef.once('value');
    const room = snap.val();
    if (!room) { btn.disabled=false; btn.textContent='ENTRAR NA SALA'; alert('Sala não encontrada! Código: '+code); return; }
    if (room.creatorRole === state.myRole) { btn.disabled=false; btn.textContent='ENTRAR NA SALA'; alert(`O criador já é ${room.creatorRole==='acusacao'?'Acusação ⚔️':'Defesa 🛡️'}. Escolha o outro papel!`); return; }
    if (room.partnerName) { btn.disabled=false; btn.textContent='ENTRAR NA SALA'; alert('Sala já está cheia!'); return; }
    state.caseIdx = room.caseIdx || 0;
    state.partnerName = room.creator;
    state.partnerRole = room.creatorRole;
    await roomRef.update({ partnerName:name, partnerRole:state.myRole, ready:true });
    btn.disabled=false; btn.textContent='ENTRAR NA SALA';
    setupRealtimeListeners();
    launchGame();
  } catch(e) { btn.disabled=false; btn.textContent='ENTRAR NA SALA'; alert('Erro: '+e.message); }
}

function showWaiting() {
  document.getElementById('card-create').style.display = 'none';
  document.querySelectorAll('.divider').forEach(el=>el.style.display='none');

    if (!room) return;
    if (room.ready && room.partnerName) {
      state.partnerName = room.partnerName;
      state.partnerRole = room.partnerRole;
      updateWaitingUI();
      roomRef.off();
      setupRealtimeListeners();
      setTimeout(()=>launchGame(), 400);
    }
  });
}

function updateWaitingUI() {
  const list = document.getElementById('players-list');

// ═══════════════════════════════════════════════════════
// REALTIME LISTENERS — sincronização total
// ═══════════════════════════════════════════════════════
function setupRealtimeListeners() {
  if (!messagesRef) return;
  let firstLoad = true;

  // Mensagens do chat principal
  messagesRef.on('child_added', snap => {
    const msg = snap.val();
    if (!msg || firstLoad) return;
    if (msg.sender !== state.myName) {
      state.messages.push(msg);
      if (msg.type === 'judge') {
        renderJudgeMessageInChat(msg.text);
      } else if (msg.type === 'sys') {
        addSysMessage(msg.text);
      } else {
        renderMessage(msg, false);
        const chatTab = document.querySelector('[data-tab="chat"]');
        if (!chatTab.classList.contains('active')) {
          document.getElementById('chat-notif').classList.add('show');
        }
      }
    }
  });
  setTimeout(()=>{ firstLoad = false; }, 1000);

  // Placar
  db.ref(`rooms/${state.roomCode}/scoreAcu`).on('value', snap => {
    const v = snap.val(); if (v !== null && v !== state.scoreAcu) { state.scoreAcu=v; document.getElementById('sc-acu').textContent=v; }
  });
  db.ref(`rooms/${state.roomCode}/scoreDef`).on('value', snap => {
    const v = snap.val(); if (v !== null && v !== state.scoreDef) { state.scoreDef=v; document.getElementById('sc-def').textContent=v; }
  });

  // Sincronização do veredito — instâncias
  db.ref(`rooms/${state.roomCode}/verdicts`).on('value', snap => {
    const vds = snap.val();
    if (!vds) return;
    ['1a','tj','stj'].forEach(inst => {
      if (vds[inst] && !instState.verdicts[inst]) {
        instState.verdicts[inst] = vds[inst];
        renderInstanceVerdict(inst, vds[inst]);
      }
    });
  });

  // Sincronização dos recursos
  db.ref(`rooms/${state.roomCode}/recursos`).on('value', snap => {
    const res = snap.val();
    if (!res) return;
    instState.recursos = { ...instState.recursos, ...res };
  });

  // Sincronização do chat de recursos (TJ/STJ)
  ['tj','stj'].forEach(inst => {
    db.ref(`rooms/${state.roomCode}/recursoChat/${inst}`).on('child_added', snap => {
      const msg = snap.val();
      if (!msg || msg._init) return;
      if (msg.sender !== state.myName) {
        appendRecursoChatMsg(inst, msg);
      }
    });
  });
}

function onChatInput() {
  const ta = document.getElementById('chat-inp');
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 100) + 'px';
}
function onChatKey(e) {
  if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}
function insertArtPill(art) {
  const inp = document.getElementById('chat-inp');
  inp.value += `[${art}] `;
  inp.focus();
}
function extractArts(text) {
  return (text.match(/\[([^\]]+)\]/g)||[]).map(m=>m.slice(1,-1));
}

async function sendMessage() {
  const inp = document.getElementById('chat-inp');
  const text = inp.value.trim();
  if (!text) return;
  const msg = {
    type:'msg', sender:state.myName, role:state.myRole, text,
    time:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),
    arts:extractArts(text),
  };
  inp.value = ''; inp.style.height = 'auto';
  state.messages.push(msg);
  renderMessage(msg, true);
  if (!state.solo && messagesRef) {
    try { await messagesRef.push(msg); } catch(e) {}
  }
  // Juiz adaptativo — analisa cada mensagem e decide se intervém
  setTimeout(()=>judgeAdaptiveAnalyze(msg), 900);
}

// ═══════════════════════════════════════════════════════
// JUIZ ADAPTATIVO — analisa e intervém quando relevante
// ═══════════════════════════════════════════════════════
async function judgeAdaptiveAnalyze(lastMsg) {
  const c = CASES[state.caseIdx];
  const allMsgs = state.messages.filter(m=>m.type==='msg');
  const count = allMsgs.length;

  // Nunca intervém nas primeiras 2 mensagens
  if (count < 2) return;

  const debateCtx = allMsgs.slice(-8).map(m=>`${m.sender} (${m.role==='acusacao'?'Acusação':'Defesa'}): ${m.text}`).join('\n');

  if (!geminiKey || !geminiKey.startsWith('AIza')) {
    // Fallback: intervém a cada 5 msgs com frases fixas
    if (count % 5 === 0) {
      const fallbacks = [
        'Advogados, o elemento subjetivo ainda não foi devidamente demonstrado. Solicito esclarecimentos.',
        'A Defesa apresentou excludente de ilicitude — a Acusação deve rebater com as provas disponíveis.',
        'Qual a qualificadora aplicável ao caso concreto? A dosimetria depende disso.',
        'O Tribunal nota contradição nos argumentos — solicita que a parte esclareça sua tese.',
        'A prova testemunhal citada é suficiente ou há outras provas materiais a considerar?',
        'O nexo causal entre a conduta e o resultado ainda não ficou claro para este Juízo.',
      ];
      const txt = fallbacks[Math.floor(count/5) % fallbacks.length];
      judgePublishMessage(txt);
    }
    return;
  }

  try {
    const decision = await callGemini(
      `Você é um Juiz de Direito. Analise o debate jurídico e decida se deve intervir.
Responda APENAS em JSON: {"intervir": true/false, "motivo": "contradiction|nova_tese|lacuna|qualificadora|nexo_causal|dosimetria|outro", "mensagem": "sua intervenção em 1-2 frases diretas, fazendo uma pergunta ou apontamento jurídico preciso"}
Só intervenha se detectar: (1) contradição clara entre argumentos, (2) tese nova sem resposta do lado contrário, (3) lacuna jurídica importante, (4) qualificadora ou causa de aumento não explorada, (5) nexo causal ou elemento do tipo ignorado.
NÃO intervenha por mensagens genéricas ou repetitivas. Seja um juiz exigente e técnico.
Considere abreviações brasileiras: tb=também, pq=porque, nao=não, mt=muito, etc.`,
      `CASO: ${c.context_juiz}\n\nDEBATE RECENTE:\n${debateCtx}\n\nÚLTIMA MENSAGEM: ${lastMsg.sender} (${lastMsg.role}): ${lastMsg.text}\n\nDeve o Juiz intervir?`,
      300
    );
    const clean = decision.replace(/```json|```/g,'').trim();
    let parsed;
    try { parsed = JSON.parse(clean); } catch(e) { return; }
    if (parsed.intervir && parsed.mensagem) {
      judgePublishMessage(parsed.mensagem);
    }
  } catch(e) {
    // silencioso — não quebra o chat
  }
}

function judgePublishMessage(text) {
  // Renderiza localmente
  renderJudgeMessageInChat(text);
  // Sincroniza para o parceiro via Firebase
  if (!state.solo && messagesRef) {
    const judgeMsg = {
      type:'judge', sender:'Juiz IA', role:'juiz', text,
      time:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})
    };
    try { messagesRef.push(judgeMsg); } catch(e) {}
  }
}

function renderJudgeMessageInChat(text) {
  const cm = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'msg judge';
  div.innerHTML = `
    <div class="msg-header">
      <span class="msg-role juiz">⚖️ JUIZ IA</span>
      <span class="msg-time">${new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</span>
    </div>
    <div class="msg-bubble">${text.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>').replace(/\n/g,'<br>')}</div>`;
  cm.appendChild(div);
  cm.scrollTop = cm.scrollHeight;
  // Notifica se não estiver na aba
  const chatTab = document.querySelector('[data-tab="chat"]');
  if (!chatTab.classList.contains('active')) {
    document.getElementById('chat-notif').classList.add('show');
  }
}

function renderMessage(msg, isMine) {
  const cm = document.getElementById('chat-messages');
  const div = document.createElement('div');
  const roleLabel = msg.role==='acusacao'?'⚔️ ACUSAÇÃO':'🛡️ DEFESA';
  div.className = `msg ${isMine?'mine':'theirs'} ${msg.role}`;
  div.innerHTML = `
    <div class="msg-header">
      <span class="msg-role ${msg.role}">${roleLabel} · ${msg.sender}</span>
      <span class="msg-time">${msg.time}</span>
    </div>
    <div class="msg-bubble">${msg.text.replace(/\[([^\]]+)\]/g,'<span class="msg-art-tag">📖 $1</span>')}</div>`;
  cm.appendChild(div);
  cm.scrollTop = cm.scrollHeight;
  const chatTab = document.querySelector('[data-tab="chat"]');
  if (!chatTab.classList.contains('active') && !isMine) {
    document.getElementById('chat-notif').classList.add('show');
  }
}

function addJudgeMessage(text) {
  renderJudgeMessageInChat(text);
}

function addSysMessage(text) {
  const cm = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'sys-msg';
  div.textContent = text;
  cm.appendChild(div);
  cm.scrollTop = cm.scrollHeight;
}

function appendRecursoChatMsg(inst, msg) {
  const container = document.getElementById(`recurso-chat-msgs-${inst}`);
  if (!container) return;
  const div = document.createElement('div');
  div.className = `rc-msg ${msg.role}`;
  const roleLabel = msg.role==='juiz'?'⚖️ JUIZ IA':msg.role==='acusacao'?'⚔️ ACUSAÇÃO':'🛡️ DEFESA';
  div.innerHTML = `<div class="rc-msg-hdr ${msg.role}">${roleLabel} · ${msg.sender} · ${msg.time}</div>${msg.text}`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

async function sendRecursoMsg(inst) {
  const inp = document.getElementById(`recurso-chat-inp-${inst}`);
  if (!inp) return;
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  const msg = {
    type:'recurso_msg', inst, sender:state.myName, role:state.myRole, text,
    time:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})
  };
  appendRecursoChatMsg(inst, msg);
  if (!state.solo) {
    try { await db.ref(`rooms/${state.roomCode}/recursoChat/${inst}`).push(msg); } catch(e) {}
  }
  // Juiz analisa o argumento do recurso
  setTimeout(()=>judgeRecursoAnalyze(inst, msg), 1200);
}

async function judgeRecursoAnalyze(inst, lastMsg) {
  const c = CASES[state.caseIdx];
  const instLabel = inst==='tj'?'Tribunal de Justiça':'STJ';
  const debateOriginal = state.messages.filter(m=>m.type==='msg').slice(-6).map(m=>`${m.sender}: ${m.text}`).join('\n');

  let judgeText = '';
  if (!geminiKey || !geminiKey.startsWith('AIza')) {
    judgeText = `O ${instLabel} registra o argumento e aguarda os demais fundamentos do recurso.`;
  } else {
    try {
      judgeText = await callGemini(
        `Você é um ${inst==='tj'?'Desembargador do TJ':'Ministro do STJ'} em sessão de julgamento de recurso. Reaja ao argumento jurídico apresentado de forma técnica e precisa. Máximo 2 frases. Pode fazer uma pergunta ou apontar fortaleza/fragilidade do argumento.`,
        `CASO: ${c.context_juiz}\nDEBATE ORIGINAL (resumo): ${debateOriginal}\n\nNO RECURSO, ${lastMsg.sender} (${lastMsg.role}) disse: "${lastMsg.text}"\n\nReaja como ${instLabel}.`,
        250
      );
    } catch(e) {
      judgeText = `O ${instLabel} registra o argumento para deliberação.`;
    }
  }
  const judgeMsg = {
    type:'recurso_msg', inst, sender:'Juiz IA', role:'juiz', text: judgeText,
    time:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})
  };
  appendRecursoChatMsg(inst, judgeMsg);
  if (!state.solo) {
    try { await db.ref(`rooms/${state.roomCode}/recursoChat/${inst}`).push(judgeMsg); } catch(e) {}
  }
}

function buildCalc(c) {
  document.getElementById('chk-agg').innerHTML = c.agravantes.map((a,i)=>`
    <div class="chk-item" id="ca-${i}" onclick="toggleChk('a',${i})">
      <div class="chk-box" id="cb-a-${i}"></div>
      <div><div class="chk-lbl">${a.t}</div><div class="chk-ef">${a.ef}</div></div>
    </div>`).join('');
  document.getElementById('chk-maj').innerHTML = c.majorantes.map((m,i)=>`
    <div class="chk-item" id="cm-${i}" onclick="toggleChk('m',${i})">
      <div class="chk-box" id="cb-m-${i}"></div>
      <div><div class="chk-lbl">${m.t}</div><div class="chk-ef">${m.ef}</div></div>
    </div>`).join('');
  calcPena();
}

function toggleChk(type, i) {
  const c = CASES[state.caseIdx];
  const items = type==='a'?c.agravantes:c.majorantes;
  const item = items[i];
  const el = document.getElementById(`c${type}-${i}`);
  const box = document.getElementById(`cb-${type}-${i}`);
  const isOn = el.classList.contains('on-agg')||el.classList.contains('on-ate');
  el.classList.remove('on-agg','on-ate'); box.textContent='';
  if (!isOn) { el.classList.add(item.tipo==='agg'?'on-agg':'on-ate'); box.textContent=item.tipo==='agg'?'+':'−'; }
  calcPena();
}

function calcPena() {
  const c = CASES[state.caseIdx];
  const pct = document.getElementById('sl-pb').value/100;
  let base = c.penaMin + pct*(c.penaMax-c.penaMin);
  document.getElementById('sl-val').textContent = base.toFixed(1)+' anos';
  document.getElementById('ph1').textContent = base.toFixed(1)+'a';
  let f2 = base;
  c.agravantes.forEach((_,i)=>{
    const el=document.getElementById(`ca-${i}`); if(!el) return;
    if(el.classList.contains('on-agg')) f2*=1.167;
    if(el.classList.contains('on-ate')) f2*=0.833;
  });
  document.getElementById('ph2').textContent = f2.toFixed(1)+'a';
  let f3 = f2;
  c.majorantes.forEach((_,i)=>{
    const el=document.getElementById(`cm-${i}`); if(!el) return;
    if(el.classList.contains('on-agg')) f3*=1.333;
    if(el.classList.contains('on-ate')) f3*=0.833;
  });
  document.getElementById('ph3').textContent = f3.toFixed(1)+'a';
  const anos = Math.max(0,f3);
  document.getElementById('calc-big').innerHTML = `${anos.toFixed(1)}<span> anos</span>`;
  let regime;
  if (anos<=4) { regime='Regime Aberto / Pena Alternativa (Art. 44 CP)'; document.getElementById('regime-txt').textContent=`${anos.toFixed(1)} anos → regime aberto. Réu primário, crime sem violência, pena ≤ 4 anos: Art. 44 é praticamente automático.`; }
  else if (anos<=8) { regime='Regime Semiaberto (Art. 33 §2º,b CP)'; document.getElementById('regime-txt').textContent=`${anos.toFixed(1)} anos → semiaberto para não reincidente. Permite trabalho externo e saídas temporárias.`; }
  else { regime='Regime Fechado (Art. 33 §2º,a CP)'; document.getElementById('regime-txt').textContent=`${anos.toFixed(1)} anos → fechado obrigatório. Pena > 8 anos ou reincidente em crime doloso.`; }
  document.getElementById('calc-regime').textContent = regime;
}

async function requestAIVerdict(instancia) {
  const c = CASES[state.caseIdx];

  // mostrar loading
  const btnReveal = document.getElementById('btn-reveal-main');
  if (btnReveal) btnReveal.style.display = 'none';
  const loadingEl = document.getElementById('ai-loading');
  if (loadingEl) loadingEl.classList.add('show');

  const instLabels = { '1a': '1ª Instância', 'tj': 'Tribunal de Justiça', 'stj': 'STJ' };

  if (loadTxt) loadTxt.textContent = `Juiz analisando ${instLabels[instancia]}...`;

  addSysMessage(`⚖️ ${instLabels[instancia]} — Juiz IA deliberando...`);
  showTab('chat');
  setTimeout(()=>showTab('veredito'), 1000);

  const debateLog = state.messages
    .filter(m=>m.type==='msg')
    .map(m=>`${m.sender} (${m.role==='acusacao'?'Acusação':'Defesa'}): ${m.text}`)
    .join('\n') || 'Nenhum argumento foi apresentado no debate.';

  const penaAcu = document.getElementById('pena-acu')?.value?.trim() || '(não informado)';
  const penaDef = document.getElementById('pena-def')?.value?.trim() || '(não informado)';
  const calcPenaVal = document.getElementById('calc-big')?.textContent || '—';

  // Monta contexto de recursos se for TJ ou STJ
  let recursosCtx = '';
  if (instancia === 'tj' && instState.recursos.tj) {
    const r = instState.recursos.tj;
    recursosCtx = `\n\nRECURSOS APRESENTADOS AO TJ:\nAcusação recorreu: ${r.acu||'não recorreu'}\nDefesa recorreu: ${r.def||'não recorreu'}`;
  }
  if (instancia === 'stj' && instState.recursos.stj) {
    const r = instState.recursos.stj;
    recursosCtx = `\n\nRECURSOS APRESENTADOS AO STJ:\nAcusação recorreu: ${r.acu||'não recorreu'}\nDefesa recorreu: ${r.def||'não recorreu'}`;
  }

  // Sentença anterior para TJ e STJ
  let sentencaAnterior = '';
  if (instancia === 'tj' && instState.verdicts['1a']) {
    const v1 = instState.verdicts['1a'];
    sentencaAnterior = `\n\nSENTENÇA DE 1ª INSTÂNCIA: ${v1.nome_resultado} — ${v1.pena}`;
  }
  if (instancia === 'stj' && instState.verdicts['tj']) {
    const vtj = instState.verdicts['tj'];
    sentencaAnterior = `\n\nACÓRDÃO DO TJ: ${vtj.nome_resultado} — ${vtj.pena}`;
    if (instState.verdicts['1a']) {
      sentencaAnterior += `\nSENTENÇA DE 1ª INSTÂNCIA: ${instState.verdicts['1a'].nome_resultado} — ${instState.verdicts['1a'].pena}`;
    }
  }

  const instInstructions = {
    '1a': `Você é o Juiz de Direito de 1ª Instância. Profira a sentença analisando EXCLUSIVAMENTE os argumentos apresentados no debate. Se um argumento não foi mencionado, NÃO o considere. Seja draconiano: julgue só o que foi dito.`,
    'tj': `Você é Desembargador do Tribunal de Justiça julgando recurso. Analise os argumentos do debate original E os fundamentos do recurso. Você PODE confirmar, reformar parcialmente ou reformar totalmente a sentença de 1ª instância. Fundamente por que reforma ou mantém.`,
    'stj': `Você é Ministro do STJ julgando recurso especial. Analise questões de direito, não fatos. Foque em violação de lei federal, divergência jurisprudencial ou contrariedade a súmula. Você PODE reformar o acórdão do TJ com base em questões jurídicas.`
  };

  const systemPrompt = instInstructions[instancia] + ` Responda APENAS em JSON válido, sem markdown, sem texto antes ou depois.`;

  const userPrompt = `${c.context_juiz}

DEBATE COMPLETO (julgue APENAS isso — se não foi mencionado, não existe):
${debateLog}

PEDIDOS DAS PARTES:
Acusação pede: ${penaAcu}
Defesa pede: ${penaDef}
Calculadora de pena (referência): ${calcPenaVal}
Placar do debate: Acusação ${state.scoreAcu} × Defesa ${state.scoreDef}${sentencaAnterior}${recursosCtx}

Profira ${instLabels[instancia]}. Responda APENAS em JSON:
{
  "resultado": "condenado" ou "absolvido" ou "parcialmente_condenado",
  "nome_resultado": "CONDENADO" ou "ABSOLVIDO" ou "CONDENADO PARCIALMENTE",
  "icon": "emoji representativo",
  "pena": "X anos e Y meses de regime Y" ou "Absolvição" ou "Extinção da punibilidade",
  "ratio": "fundamentação principal em 2-3 frases, citando APENAS o que as partes disseram no debate",
  "fundamentacao": "fundamentação completa com dosimetria. Mencione explicitamente o que foi e o que NÃO foi apresentado pelas partes e como isso influenciou",
  "reforma": "manteve" ou "reformou" ou "reformou parcialmente" (apenas para TJ e STJ),
  "artigos": ["Art. X CP", "Art. Y CP"]
}`;

  if (!geminiKey || !geminiKey.startsWith('AIza')) {
    await new Promise(r=>setTimeout(r, 2000));

    instState.verdicts[instancia] = fallback;
    renderInstanceVerdict(instancia, fallback);
    return;
  }

  try {
    const raw = await callGemini(systemPrompt, userPrompt, 1400);
    const clean = raw.replace(/```json|```/g,'').trim();
    let v;
    try { v = JSON.parse(clean); } catch(e) { v = null; }
    if (v) {
      instState.verdicts[instancia] = v;
      renderInstanceVerdict(instancia, v);
    } else {
      const fallback = generateFallbackVerdict(c, state.scoreAcu, state.scoreDef, instancia);
      instState.verdicts[instancia] = fallback;
      renderInstanceVerdict(instancia, fallback);
    }
  } catch(e) {
    console.error('Gemini Verdict error:', e);
    const fallback = generateFallbackVerdict(c, state.scoreAcu, state.scoreDef, instancia);
    instState.verdicts[instancia] = fallback;
    renderInstanceVerdict(instancia, fallback);
  }
}

function buildInstNav(currentInst) {
  const insts = [
    { key:'1a', label:'1ª Instância', icon:'⚖️' },
    { key:'tj', label:'TJ', icon:'🏛️' },
    { key:'stj', label:'STJ', icon:'🔴' },

  const btns = insts.map(i => {
    const v = instState.verdicts[i.key];
    const isActive = i.key === currentInst;
    const isDone = !!v;
    const resCls = isDone ? (v.resultado==='absolvido'?'done-absol':v.resultado==='parcialmente_condenado'?'done-parc':'done-cond') : '';
    const isLocked = !isDone && i.key !== currentInst;
    return `<button class="inst-btn ${isActive?'active':''} ${resCls} ${isLocked?'locked':''}"
      onclick="${isDone?`switchInstPanel('${i.key}')`:''}"
      style="${isLocked?'pointer-events:none':''}"
    ><span class="inst-dot"></span>${i.icon} ${i.label}${isDone&&!isActive?` — ${v.nome_resultado}`:''}${isActive?' ◀':''}</button>`;
  }).join('');
  return `<div class="inst-nav">${btns}</div>`;
}

function switchInstPanel(instancia) {
  if (!instState.verdicts[instancia]) return;
  instState.currentInst = instancia;
  renderInstanceVerdict(instancia, instState.verdicts[instancia]);
  // re-render recursosHTML corretamente já embutido acima
}

function openRecurso(fromInst, side, toInst) {
  const container = document.getElementById(`recurso-input-${fromInst}`);
  if (!container) return;
  const label = side==='acu'?'⚔️ ACUSAÇÃO':'🛡️ DEFESA';
  const sideLabel = side==='acu'?'Acusação':'Defesa';
  container.style.display = 'block';
  container.innerHTML = `
    <div class="recurso-input-wrap">
      <div class="ri-label ${side}">${label} — Fundamentos do recurso ao ${toInst==='tj'?'TJ':'STJ'}</div>
      <textarea class="ri-ta" id="ri-ta-${fromInst}-${side}" placeholder="Digite os fundamentos jurídicos do recurso: qual erro da decisão, qual lei foi violada, qual tese deve ser reconhecida..."></textarea>
      <button class="btn-enviar-recurso" onclick="submitRecurso('${fromInst}','${side}','${toInst}')">Confirmar Recurso da ${sideLabel}</button>
    </div>`;
}

function submitRecurso(fromInst, side, toInst) {
  const ta = document.getElementById(`ri-ta-${fromInst}-${side}`);
  const texto = ta ? ta.value.trim() : '';
  if (!texto) { alert('Digite o fundamento do recurso!'); return; }

  if (!instState.recursos[toInst]) instState.recursos[toInst] = {};
  instState.recursos[toInst][side] = texto;

  // Sincroniza com parceiro
  if (!state.solo) {
    try { db.ref(`rooms/${state.roomCode}/recursos/${toInst}/${side}`).set(texto); } catch(e) {}
  }

  // Feedback visual
  const container = document.getElementById(`recurso-input-${fromInst}`);
  const label = side==='acu'?'⚔️ ACUSAÇÃO':'🛡️ DEFESA';
  container.innerHTML = `<div class="recurso-arg ${side}"><div style="font-family:var(--mono);font-size:9px;margin-bottom:5px;">${label} — recurso registrado ✓</div><div style="font-size:12px;color:var(--text2);">${texto}</div></div>`;

  // Desabilita o botão do lado que recorreu
  const btn = document.getElementById(`btn-rec-${side}-${fromInst}`);
  if (btn) { btn.disabled = true; btn.textContent = side==='acu'?'⚔️ Acusação Recorreu ✓':'🛡️ Defesa Recorreu ✓'; }

  // Mostra botão de submeter ao próximo tribunal
  const readyEl = document.getElementById(`recurso-ready-${fromInst}`);
  if (readyEl) readyEl.style.display = 'block';

  addSysMessage(`📋 Recurso da ${side==='acu'?'Acusação':'Defesa'} registrado para o ${toInst==='tj'?'TJ':'STJ'}.`);
}

function generateFallbackVerdict(c, scoreAcu, scoreDef, instancia) {
  const reforma = instancia==='1a' ? undefined :
    (instancia==='tj' ? (scoreDef > scoreAcu ? 'reformou' : 'manteve') :
    (scoreAcu > scoreDef ? 'reformou' : 'manteve'));
  if (scoreAcu > scoreDef) {
    return {
      resultado:'condenado', nome_resultado:'CONDENADO', icon:'⚔️',
      pena: c.penaMin ? `${(c.penaMin+(c.penaMax-c.penaMin)*0.4).toFixed(0)} anos` : '2 anos',
      ratio:`A Acusação apresentou argumentos mais sólidos (${scoreAcu}×${scoreDef}). Os elementos do tipo penal foram demonstrados e as teses defensivas não foram suficientemente fundamentadas.`,
      fundamentacao:`Com base nos argumentos apresentados no debate, a Acusação foi mais técnica e objetiva. A Defesa não conseguiu afastar a tipicidade da conduta com argumentos suficientes.`,
      artigos: c.arts_rapidos.slice(0,3), reforma
    };
  } else if (scoreDef > scoreAcu) {
    return {
      resultado:'absolvido', nome_resultado:'ABSOLVIDO', icon:'🛡️',
      pena:'Absolvição',
      ratio:`A Defesa apresentou teses mais consistentes (${scoreDef}×${scoreAcu}). As excludentes e dúvidas razoáveis levantadas prevalecem pelo princípio in dubio pro reo.`,
      fundamentacao:`A Defesa foi mais técnica no debate. O Tribunal não encontrou provas suficientes para superar a presunção de inocência com os argumentos apresentados.`,
      artigos: c.arts_rapidos.slice(0,2), reforma
    };
  } else {
    return {
      resultado:'parcialmente_condenado', nome_resultado:'CONDENADO PARCIALMENTE', icon:'⚖️',
      pena: `${c.penaMin?c.penaMin.toFixed(0):'1'} ano (mínimo)`,
      ratio:`Debate equilibrado (${scoreAcu}×${scoreDef}). Condenação parcial com pena mínima reconhecendo parte das teses defensivas.`,
      fundamentacao:`O debate empatado reflete complexidade do caso. O Tribunal reconhece elementos de ambos os lados e condena na pena mínima.`,
      artigos: c.arts_rapidos.slice(0,2), reforma
    };
  }
}

initLobby();
</script>
